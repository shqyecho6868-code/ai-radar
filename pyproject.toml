[project]
name = "ai-radar"
version = "0.1.0"
description = "Weekly AI learning brief: fetch, pick one durable topic, push to Telegram."
requires-python = ">=3.12"
dependencies = ["feedparser>=6.0", "anthropic>=2.3,<3", "httpx>=0.27", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
