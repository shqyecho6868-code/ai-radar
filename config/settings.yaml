# Collection window. Weekly brief runs Sunday, so look back a little over a week
# to tolerate a late or skipped run.
lookback_days: 8
# Per-source caps keep one noisy source from flooding the candidate pool.
max_items_per_source: 15
hn:
  min_points: 150
  max_hits: 100
hf_papers:
  min_upvotes: 20
  max_items: 15
github_repos:
  min_stars: 300
  topics: [llm, ai-agents, mcp, rag, llm-inference]
  max_items: 15
aihot:
  max_pages: 3
  max_items: 40

# Weekly brief
timezone: America/Los_Angeles
# Scheduled runs before this local hour are skipped (cron fires at two UTC times to
# cover daylight saving; the first run at or after this hour publishes).
publish_hour: 8
llm:
  # Claude API (Anthropic). Key from https://platform.claude.com, stored as repo secret.
  model: "claude-opus-5-5"
  effort: high
  max_tokens: 32000
  # SDK retries on connection errors, 429 and 5xx; after that the run fails and Telegram says so.
  max_retries: 2
  api_key_env: ANTHROPIC_API_KEY
