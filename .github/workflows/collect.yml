name: collect

# Weekly material pool for the learning doc. No LLM call: fetch, dedup, commit.
# Claude reads pool/<week>/ on Sunday when it writes the week's study doc.
on:
  schedule:
    - cron: "17 12 * * 0"  # Sunday 12:17 UTC, before the Sunday morning write-up
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          week=$(date -u +%G-W%V)
          python -m ai_radar.collect --out "pool/$week"
          cat "pool/$week/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add pool
          git diff --cached --quiet || git commit -m "Material pool $(date -u +%G-W%V)"
          git push
