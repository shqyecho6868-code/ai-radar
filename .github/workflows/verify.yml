name: verify

# M1 check: unit tests + a real collection run from GitHub's network.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Collect candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m ai_radar.collect --out out
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Weekly dry run (real Claude call, no Telegram, no commit)
        # Paid API call: only on a manual run, not on every push.
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "ANTHROPIC_API_KEY not set, skipping"; exit 0; }
          python -m ai_radar.weekly --dry-run --force
          cat out/*-W*.md >> "$GITHUB_STEP_SUMMARY"
          cat out/*-W*.md   # also in the log, readable through the API
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidates
          path: out/
